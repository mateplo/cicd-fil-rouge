# Intégration continue de TaskFlow : lint (ruff) et tests (pytest).
# Les deux jobs sont indépendants et tournent en parallèle.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Vérifier le lint
        run: ruff check .
      - name: Vérifier la mise en forme
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: pytest --vraimentpaslabonnecommande